<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運草 Clover｜GodiVanLife</title>

    <style>
        :root {
            --clover-green: #74C365;
            --clover-bg: #F4F9F3;
            --warning-red: #FF5252;
        }

        body {
            font-family: 'PingFang TC','Microsoft JhengHei',sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--clover-bg);
            text-align: center;
        }

        .container {
            background: #fff;
            border-radius: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            padding: 28px;
            max-width: 420px;
            margin: auto;
        }

        .profile-img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 6px solid var(--clover-green);
            object-fit: cover;
            margin-bottom: 18px;
        }

        h1 {
            color: var(--clover-green);
            font-size: 28px;
        }

        .tagline {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .warning-box {
            background: #FFF5F5;
            color: var(--warning-red);
            padding: 14px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .info-card {
            background: #FAFAFA;
            padding: 18px;
            border-radius: 18px;
            text-align: left;
            margin-bottom: 20px;
            border-left: 5px solid var(--clover-green);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border-radius: 30px;
            border: none;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }

        .btn-sms { background: #007aff; }
        .btn-call { background: #4CAF50; }

        footer {
            margin-top: 25px;
            font-size: 11px;
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 直接讀取根目錄圖片 -->
    <img src="00DD3F10-D2D6-4E4A-84F2-39B0C4FD9EA5.JPG" 
         alt="幸運草 Clover" 
         class="profile-img">

    <h1>我是幸運草 Clover</h1>
    <p class="tagline">GodiVanLife 智慧守護</p>

    <div class="warning-box">
        ⚠️ 緊張時會一直吠叫，我只是膽小長個不長膽，請溫柔對待我～
    </div>

    <div class="info-card">
        💖 <strong>關於我：</strong>
        很親人（尤其美女🤣），看到男生會有點怕怕的。<br><br>
        🐕 <strong>社交：</strong>
        不太親狗（男狗狗請不要靠近，女生狗狗OK）。<br><br>
        🍗 <strong>興趣：</strong>
        最愛玩玩具跟吃肉肉了！
    </div>

    <button class="btn btn-sms" onclick="sendSMSLocation()">
        📍 即時定位通報
    </button>

    <a href="tel:0936760420" class="btn btn-call">
        📞 撥打給主人
    </a>

    <footer>
        POWERED BY GODIVANLIFE
    </footer>

</div>

<script>
function sendSMSLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const mapUrl = "https://www.google.com/maps?q=" + lat + "," + lng;
            const message = encodeURIComponent("【尋寵通報】我發現了幸運草！目前位置：" + mapUrl);
            window.location.href = "sms:0936760420?body=" + message;
        });
    }
}
</script>

</body>
</html>
