<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clover | GodiVanLife</title>

<style>

:root{
--green:#74C365;
--bg:#F4F9F3;
--warn:#FF5252;
}

body{
font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;
margin:0;
padding:20px;
background:var(--bg);
text-align:center;
}

.container{
background:white;
border-radius:35px;
padding:28px;
max-width:420px;
margin:auto;
box-shadow:0 15px 35px rgba(0,0,0,0.08);
}

.profile-img{
width:200px;
height:200px;
border-radius:50%;
border:6px solid var(--green);
object-fit:cover;
margin-bottom:18px;
}

.language-switch{
margin-bottom:10px;
}

.lang-btn{
padding:6px 12px;
margin:3px;
border:none;
border-radius:15px;
background:#eee;
cursor:pointer;
}

h1{
color:var(--green);
}

.warning{
background:#FFF5F5;
color:var(--warn);
padding:14px;
border-radius:15px;
margin-bottom:20px;
font-weight:bold;
}

.info{
background:#FAFAFA;
padding:18px;
border-radius:18px;
text-align:left;
margin-bottom:20px;
border-left:5px solid var(--green);
line-height:1.6;
}

.btn{
display:block;
width:100%;
padding:16px;
margin:12px 0;
border-radius:30px;
border:none;
font-size:17px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
color:white;
}

.btn-location{
background:#007aff;
}

.btn-ig{
background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);
}

footer{
margin-top:25px;
font-size:11px;
color:#aaa;
}

</style>
</head>

<body>

<div class="container">

<div class="language-switch">

<button class="lang-btn" onclick="setLang('zh')">中文</button>
<button class="lang-btn" onclick="setLang('ja')">日本語</button>
<button class="lang-btn" onclick="setLang('en')">English</button>

</div>

<img src="https://raw.githubusercontent.com/godivanlife-creator/clover_20200825/main/00DD3F10-D2D6-4E4A-84F2-39B0C4FD9EA5.JPG"
class="profile-img">

<h1>Clover</h1>

<div class="warning" id="warning"></div>

<div class="info" id="info"></div>

<button class="btn btn-location" onclick="sendLocation()" id="locationBtn"></button>

<a href="https://www.instagram.com/clover_20200825_clover"
target="_blank"
class="btn btn-ig"
id="igBtn"></a>

<footer>
POWERED BY GODIVANLIFE
</footer>

</div>

<script>

const text={

zh:{
warning:"⚠️ 緊張時可能會吠叫，請溫柔接近。",
info:"💖 很親人（尤其美女🤣）\n\n🐕 不太親狗\n\n🍗 喜歡玩玩具和吃肉",
location:"📍 傳送我的位置",
ig:"📸 用 IG 聯絡主人"
},

ja:{
warning:"⚠️ 緊張すると吠えることがあります。優しく接してください。",
info:"💖 とても人懐っこいです（特に女性が好き🤣）\n\n🐕 犬は少し苦手\n\n🍗 おもちゃとお肉が大好き",
location:"📍 位置を送る",
ig:"📸 Instagramで連絡"
},

en:{
warning:"⚠️ I may bark when nervous. Please approach gently.",
info:"💖 Very friendly (especially loves girls 🤣)\n\n🐕 Not very friendly with other dogs\n\n🍗 Loves toys and meat",
location:"📍 Send my location",
ig:"📸 Contact via Instagram"
}

};

function setLang(lang){

document.getElementById("warning").innerText=text[lang].warning;
document.getElementById("info").innerText=text[lang].info;
document.getElementById("locationBtn").innerText=text[lang].location;
document.getElementById("igBtn").innerText=text[lang].ig;

}

setLang('ja');

function sendLocation(){

if(!navigator.geolocation){

alert("Location not available");
return;

}

navigator.geolocation.getCurrentPosition(function(position){

const lat=position.coords.latitude;
const lng=position.coords.longitude;

const map="https://www.google.com/maps?q="+lat+","+lng;

navigator.clipboard.writeText(map);

window.open("https://www.instagram.com/clover_20200825_clover","_blank");

});

}

</script>

</body>
</html>
