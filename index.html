<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クローバー Clover｜GodiVanLife</title>

<style>
:root{
--clover-green:#74C365;
--clover-bg:#F4F9F3;
--warning-red:#FF5252;
}

body{
font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo',sans-serif;
margin:0;
padding:20px;
background:var(--clover-bg);
text-align:center;
}

.container{
background:#fff;
border-radius:35px;
box-shadow:0 15px 35px rgba(0,0,0,0.08);
padding:28px;
max-width:420px;
margin:auto;
}

.profile-img{
width:200px;
height:200px;
border-radius:50%;
border:6px solid var(--clover-green);
object-fit:cover;
margin-bottom:18px;
}

h1{
color:var(--clover-green);
font-size:26px;
}

.tagline{
color:#777;
font-size:14px;
margin-bottom:20px;
}

.warning-box{
background:#FFF5F5;
color:var(--warning-red);
padding:14px;
border-radius:15px;
margin-bottom:20px;
font-weight:bold;
}

.info-card{
background:#FAFAFA;
padding:18px;
border-radius:18px;
text-align:left;
margin-bottom:20px;
border-left:5px solid var(--clover-green);
line-height:1.6;
}

.btn{
display:block;
width:100%;
padding:15px;
margin:12px 0;
border-radius:30px;
border:none;
font-size:17px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
color:white;
}

.btn-ig{
background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);
}

.btn-location{
background:#007aff;
}

footer{
margin-top:25px;
font-size:11px;
color:#aaa;
}
</style>
</head>

<body>

<div class="container">

<img src="https://raw.githubusercontent.com/godivanlife-creator/clover_20200825/main/00DD3F10-D2D6-4E4A-84F2-39B0C4FD9EA5.JPG"
alt="Clover"
class="profile-img">

<h1>クローバー Clover</h1>
<p class="tagline">GodiVanLife ペット守護タグ</p>

<div class="warning-box">
⚠️ 緊張すると吠えることがあります。  
優しく接してください。
</div>

<div class="info-card">

💖 <strong>性格</strong><br>
とても人懐っこいです（特に女性が大好きです🤣）<br>
男性には少し怖がることがあります。

<br><br>

🐕 <strong>犬との関係</strong><br>
あまり犬と仲良くできません。<br>
男の子の犬は近づかないでください。

<br><br>

🍗 <strong>好きなこと</strong><br>
おもちゃで遊ぶこととお肉が大好きです。

</div>

<button class="btn btn-location" onclick="copyLocation()">
📍 現在地をコピー
</button>

<a href="https://www.instagram.com/clover_20200825_clover"
target="_blank"
class="btn btn-ig">
📸 Instagramで連絡する
</a>

<footer>
POWERED BY GODIVANLIFE
</footer>

</div>

<script>

function copyLocation(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(position){

const lat=position.coords.latitude;
const lng=position.coords.longitude;

const map="https://www.google.com/maps?q="+lat+","+lng;

navigator.clipboard.writeText(map);

alert("現在地リンクをコピーしました。Instagramのメッセージで送ってください。");

});

}

}

</script>

</body>
</html>
